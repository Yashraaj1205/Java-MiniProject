<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LendFlow | Admin Settings</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #8b5cf6;
            --primary-dark: #7c3aed;
            --bg: #0f172a;
            --surface: #1e293b;
            --text: #f1f5f9;
            --text-muted: #94a3b8;
            --border: #334155;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }

        .header {
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header h1 {
            font-size: 2rem;
            color: var(--primary);
        }

        .card {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background-color: var(--bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .qr-preview {
            margin-top: 15px;
            max-width: 200px;
            border-radius: 12px;
            border: 2px dashed var(--border);
            padding: 5px;
        }

        .qr-preview img {
            width: 100%;
            border-radius: 8px;
            display: block;
        }

        .btn {
            display: inline-block;
            background-color: var(--primary);
            color: white;
            padding: 12px 30px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1rem;
        }

        .btn:hover {
            background-color: var(--primary-dark);
            transform: translateY(-2px);
        }

        .alert {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .alert-success {
            background-color: rgba(16, 185, 129, 0.1);
            border: 1px solid var(--success);
            color: var(--success);
        }

        .back-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .back-link:hover {
            color: var(--primary);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <a href="/" class="back-link"><i class="fas fa-arrow-left"></i> Dashboard</a>
                <h1><i class="fas fa-cog"></i> Settings</h1>
            </div>
        </div>

        <div th:if="${success}" class="alert alert-success">
            <i class="fas fa-check-circle"></i> <span th:text="${success}"></span>
        </div>

        <div class="card">
            <form th:action="@{/admin/settings/update}" method="post" enctype="multipart/form-data">
                <div class="form-group">
                    <label for="ownerName">Owner / Business Name</label>
                    <input type="text" id="ownerName" name="ownerName" th:value="${settings.ownerName}" required placeholder="e.g. LendFlow Admin">
                </div>

                <div class="form-group">
                    <label for="upiId">UPI ID for Repayments</label>
                    <input type="text" id="upiId" name="upiId" th:value="${settings.upiId}" required placeholder="e.g. handle@upi">
                </div>

                <div class="form-group">
                    <label for="qrCodeFile">UPI QR Code Image</label>
                    <input type="file" id="qrCodeFile" name="qrCodeFile" accept="image/*">
                    <div th:if="${settings.qrCodePath}" class="qr-preview">
                        <img th:src="${settings.qrCodePath}" alt="UPI QR Code">
                    </div>
                </div>

                <div style="margin-top: 30px;">
                    <button type="submit" class="btn"><i class="fas fa-save"></i> Save Settings</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
