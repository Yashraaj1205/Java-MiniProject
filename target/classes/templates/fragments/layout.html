<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LendFlow</title>
    <!-- Inject Local Storage Theme -->
    <script>
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
    </script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <!-- Sidebar Fragment -->
    <div th:fragment="sidebar(activePage)">
        <div class="sidebar">
            <div class="brand">
                <div class="logo-icon">₹</div>
                <div>
                    LendFlow
                    <span>Lending Manager</span>
                </div>
            </div>

            <a th:href="@{/dashboard}" class="nav-item" th:classappend="${activePage == 'dashboard'} ? 'active' : ''">
                <i class="fa-solid fa-border-all"></i> Dashboard
            </a>
            <a th:href="@{/borrowers}" class="nav-item" th:classappend="${activePage == 'borrowers'} ? 'active' : ''">
                <i class="fa-solid fa-users"></i> Borrowers
            </a>
            <a th:href="@{/loans}" class="nav-item" th:classappend="${activePage == 'loans'} ? 'active' : ''">
                <i class="fa-solid fa-file-invoice-dollar"></i> Loans
            </a>
            <a th:href="@{/notifications}" class="nav-item" th:classappend="${activePage == 'notifications'} ? 'active' : ''">
                <i class="fa-regular fa-bell"></i> Notifications
                <span th:if="${notificationCount > 0}" class="badge bg-danger rounded-pill ms-auto" th:text="${notificationCount}"></span>

            <a th:href="@{/settings}" class="nav-item" th:classappend="${activePage == 'settings'} ? 'active' : ''">
                <i class="fa-solid fa-gear"></i> Settings
            </a>

            <div class="nav-spacer"></div>

            <div class="user-profile">
                <div class="user-avatar">RS</div>
                <div>
                    <div style="font-weight: 600; font-size: 0.9rem;">Rajesh S.</div>
                    <div style="font-size: 0.75rem; color: #8C94A8;">Admin</div>
                </div>
                <i class="fa-solid fa-arrow-right-from-bracket ms-auto pe-2" style="color: #8C94A8; cursor: pointer;"></i>
            </div>
        </div>
    </div>

    <!-- Scripts Fragment -->
    <div th:fragment="scripts">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    </div>

</body>
</html>
