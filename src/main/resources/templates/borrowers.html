<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borrowers - LendFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/layout :: sidebar('borrowers')}"></div>
    <div class="content">
        <div class="d-flex justify-content-between align-items-center mb-1">
            <h1 class="page-title mb-0">Borrowers</h1>
            <button class="btn" style="background:#FFB800; color:#000; font-weight:600;" data-bs-toggle="modal" data-bs-target="#addBorrowerModal">
                <i class="fa-solid fa-plus me-1"></i> Add Borrower
            </button>
        </div>
        <p class="page-subtitle">Manage your customer database</p>
        
        <div class="table-card mt-4">
            <h5 class="fw-bold mb-3">Borrowers List</h5>
            
            <table class="table table-borderless">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Phone</th>
                        <th>Total Pending</th>
                        <th>Risk Profile</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="borrower : ${borrowers}">
                        <td th:text="${borrower.id}">1</td>
                        <td th:text="${borrower.name}" class="fw-bold" style="color:#11142D;">Name</td>
                        <td th:text="${borrower.phone}">Phone</td>
                        <td th:text="${'₹' + #numbers.formatDecimal(borrower.totalPendingAmount, 0, 'COMMA', 0, 'POINT')}" style="color: #C62828; font-weight: 600;">₹0</td>
                        <td>
                            <span th:if="${borrower.riskProfile == 'Low'}" class="badge-status badge-active">Low Risk</span>
                            <span th:if="${borrower.riskProfile == 'Medium'}" class="badge-status badge-completed">Medium Risk</span>
                            <span th:if="${borrower.riskProfile == 'High'}" class="badge-status badge-overdue">High Risk</span>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(borrowers)}">
                        <td colspan="5" class="text-center text-muted py-4">No borrowers found. Add your first customer!</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Add Borrower Modal -->
    <div class="modal fade" id="addBorrowerModal" tabindex="-1" aria-labelledby="addBorrowerModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content" style="border-radius: 12px; border: none;">
                <div class="modal-header" style="border-bottom: 1px solid #f0f0f0;">
                    <h5 class="modal-title fw-bold" id="addBorrowerModalLabel">Add New Borrower</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form th:action="@{/borrowers/add}" th:object="${newBorrower}" method="post">
                    <div class="modal-body p-4">
                        <div class="mb-3">
                            <label class="form-label text-muted fw-semibold" style="font-size: 0.85rem;">Full Name *</label>
                            <input type="text" th:field="*{name}" class="form-control" required placeholder="e.g. Rahul Sharma">
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted fw-semibold" style="font-size: 0.85rem;">Phone Number *</label>
                            <input type="tel" th:field="*{phone}" class="form-control" required placeholder="+91 9999999999">
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted fw-semibold" style="font-size: 0.85rem;">Address</label>
                            <textarea th:field="*{address}" class="form-control" rows="2" placeholder="Shop Street, City"></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted fw-semibold" style="font-size: 0.85rem;">Risk Profile *</label>
                            <select th:field="*{riskProfile}" class="form-select" required>
                                <option value="Low">Low Risk</option>
                                <option value="Medium">Medium Risk</option>
                                <option value="High">High Risk</option>
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer" style="border-top: 1px solid #f0f0f0;">
                        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn" style="background:#FFB800; color:#000; font-weight:600;">Save Borrower</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
