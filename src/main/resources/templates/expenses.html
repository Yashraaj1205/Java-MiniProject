<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expenses - LendFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <div th:replace="~{fragments/layout :: sidebar('expenses')}"></div>

    <div class="content">
        <div class="d-flex justify-content-between align-items-center mb-1">
            <h1 class="page-title mb-0">Shop Expenses</h1>
            <button class="btn" style="background:#FFB800; color:#000; font-weight:600;" data-bs-toggle="modal" data-bs-target="#addExpenseModal">
                <i class="fa-solid fa-plus me-1"></i> Add Expense
            </button>
        </div>
        <p class="page-subtitle" th:text="${'Track your business outgoings for ' + currentMonth}">Track your business outgoings</p>

        <div class="row mb-4">
            <div class="col-md-4">
                <div class="stat-card" style="height: 100%;">
                    <div class="stat-title">Total Expenses This Month</div>
                    <div class="stat-value" th:text="${'₹' + #numbers.formatDecimal(totalExpenses, 0, 'COMMA', 0, 'POINT')}">₹0</div>
                    <div class="stat-trend trend-down"><i class="fa-solid fa-calculator"></i> Track to maintain P&L</div>
                </div>
            </div>
        </div>

        <div class="table-card mt-4">
            <h5 class="fw-bold mb-3">Expense Log</h5>
            
            <table class="table table-borderless">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Category</th>
                        <th>Amount</th>
                        <th>Payment Method</th>
                        <th>Description</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="expense : ${expenses}">
                        <td th:text="${#temporals.format(expense.expenseDate, 'MMM dd, yyyy')}">Date</td>
                        <td><span class="badge" style="background:var(--border-light); color:var(--text-main);" th:text="${expense.category}">Cat</span></td>
                        <td th:text="${'₹' + #numbers.formatDecimal(expense.amount, 0, 'COMMA', 0, 'POINT')}" class="fw-bold" style="color:#C62828;">₹0</td>
                        <td th:text="${expense.paymentMethod}">Method</td>
                        <td th:text="${expense.description}" class="text-muted">Desc</td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(expenses)}">
                        <td colspan="5" class="text-center text-muted py-4">No expenses recorded this month.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    
    <div class="modal fade" id="addExpenseModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content" style="border-radius: 12px; border: none;">
                <div class="modal-header" style="border-bottom: 1px solid var(--border-color);">
                    <h5 class="modal-title fw-bold">Add Expense</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form th:action="@{/expenses/add}" th:object="${newExpense}" method="post">
                    <div class="modal-body p-4">
                        <div class="mb-3">
                            <label class="form-label">Category *</label>
                            <select th:field="*{category}" class="form-select" required>
                                <option value="Rent">Shop Rent</option>
                                <option value="Salary">Staff Salary</option>
                                <option value="Stock">Stock / Inventory</option>
                                <option value="Utility">Electricity/Water</option>
                                <option value="Transport">Transport</option>
                                <option value="Misc">Miscellaneous</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Amount (₹) *</label>
                            <input type="number" th:field="*{amount}" class="form-control" required min="1">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Date</label>
                            <input type="date" th:field="*{expenseDate}" class="form-control">
                            <small class="text-muted">Leave blank for today</small>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Payment Method</label>
                            <select th:field="*{paymentMethod}" class="form-select">
                                <option value="Cash">Cash</option>
                                <option value="UPI">UPI</option>
                                <option value="Bank Transfer">Bank Transfer</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <input type="text" th:field="*{description}" class="form-control" placeholder="e.g. EB Bill March">
                        </div>
                    </div>
                    <div class="modal-footer" style="border-top: 1px solid var(--border-color);">
                        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn" style="background:#FFB800; color:#000; font-weight:600;">Add Expense</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
