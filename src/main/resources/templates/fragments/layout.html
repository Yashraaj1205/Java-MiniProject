<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LendFlow</title>
    
    <script>
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
    </script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    
    <div th:fragment="sidebar(activePage)">
        <div class="sidebar">
            <div class="brand" style="justify-content: center; padding-bottom: 25px;">
                <img th:src="@{/images/logo.png}" alt="LendFlow Logo" class="brand-logo shadow-sm">
            </div>

            <a th:href="@{/dashboard}" class="nav-item" th:classappend="${activePage == 'dashboard'} ? 'active' : ''">
                <i class="fa-solid fa-border-all"></i> Dashboard
            </a>
            <a th:href="@{/borrowers}" class="nav-item" th:classappend="${activePage == 'borrowers'} ? 'active' : ''">
                <i class="fa-solid fa-users"></i> Borrowers
            </a>
            <a th:href="@{/loans}" class="nav-item" th:classappend="${activePage == 'loans'} ? 'active' : ''">
                <i class="fa-solid fa-file-invoice-dollar"></i> Loans
            </a>
            <a th:href="@{/notifications}" class="nav-item" th:classappend="${activePage == 'notifications'} ? 'active' : ''">
                <i class="fa-regular fa-bell"></i> Notifications
                <span th:if="${notificationCount > 0}" class="badge bg-danger rounded-pill ms-auto" th:text="${notificationCount}"></span>
            </a>

            <a th:href="@{/expenses}" class="nav-item" th:classappend="${activePage == 'expenses'} ? 'active' : ''">
                <i class="fa-solid fa-wallet"></i> Expenses
            </a>

            <a th:href="@{/admin/settings}" class="nav-item" th:classappend="${activePage == 'settings'} ? 'active' : ''">
                <i class="fa-solid fa-gear"></i> Settings
            </a>

            <div class="nav-spacer"></div>

            <div class="user-profile">
                <div class="user-avatar">RS</div>
                <div style="min-width: 0; flex-grow: 1;">
                    <div style="font-weight: 600; font-size: 0.85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" th:title="${session.adminEmail != null ? session.adminEmail : 'Admin'}" th:text="${session.adminEmail != null ? session.adminEmail : 'Admin'}">Admin</div>
                    <div style="font-size: 0.75rem; color: #8C94A8;">Logged In</div>
                </div>
                <i class="fa-solid fa-arrow-right-from-bracket ms-auto pe-2" style="color: #8C94A8; cursor: pointer;" id="logoutBtn" title="Sign Out"></i>
            </div>
            <script>
                document.getElementById('logoutBtn').addEventListener('click', () => {
                    fetch('/api/auth/logout', { method: 'POST' }).then(() => {
                        window.location.href = '/login';
                    });
                });
            </script>
        </div>

        
        <button class="theme-toggle-btn" id="themeToggleBtn" title="Toggle Dark Mode">
            <i class="fa-solid fa-moon" id="themeIcon"></i>
        </button>
    </div>

    
    <div th:fragment="scripts">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <script>
            document.addEventListener("DOMContentLoaded", () => {
                const btn = document.getElementById("themeToggleBtn");
                const icon = document.getElementById("themeIcon");
                const currentTheme = localStorage.getItem("theme");

                function updateIcon(isDark) {
                    if (isDark) {
                        icon.classList.remove("fa-moon");
                        icon.classList.add("fa-sun");
                        btn.classList.add("active-dark");
                    } else {
                        icon.classList.remove("fa-sun");
                        icon.classList.add("fa-moon");
                        btn.classList.remove("active-dark");
                    }
                }

                updateIcon(currentTheme === "dark");

                btn.addEventListener("click", () => {
                    const isDark = document.documentElement.getAttribute("data-theme") === "dark";
                    if (isDark) {
                        document.documentElement.removeAttribute("data-theme");
                        localStorage.setItem("theme", "light");
                        updateIcon(false);
                    } else {
                        document.documentElement.setAttribute("data-theme", "dark");
                        localStorage.setItem("theme", "dark");
                        updateIcon(true);
                    }
                });
            });
        </script>
    </div>

</body>
</html>
