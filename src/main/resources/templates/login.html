<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LendFlow - Secure Authentication</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: #0f1219;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            position: relative;
            overflow: hidden;
        }

        /* Abstract Aurora Background */
        .ambient-light {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            z-index: 0;
            animation: float 20s infinite ease-in-out alternate;
        }

        .light-1 {
            width: 50vw;
            height: 50vw;
            background: linear-gradient(135deg, rgba(255, 184, 0, 0.15) 0%, rgba(255, 30, 86, 0.05) 100%);
            top: -20vh;
            left: -10vw;
        }

        .light-2 {
            width: 40vw;
            height: 40vw;
            background: linear-gradient(135deg, rgba(66, 133, 244, 0.1) 0%, rgba(139, 92, 246, 0.1) 100%);
            bottom: -10vh;
            right: -10vw;
            animation-delay: -5s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(5%, 10%) scale(1.1); }
            100% { transform: translate(-5%, -5%) scale(0.95); }
        }

        /* Glassmorphism Card */
        .login-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 440px;
            padding: 20px;
        }

        .login-card {
            background: rgba(30, 32, 41, 0.4);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 48px 40px;
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.4), inset 0 0 0 1px rgba(255, 255, 255, 0.05);
            text-align: center;
        }

        .brand-logo {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #FFB800 0%, #FF8A00 100%);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: #000;
            font-weight: 800;
            margin: 0 auto 24px;
            box-shadow: 0 12px 24px rgba(255, 184, 0, 0.3), inset 0 2px 0 rgba(255, 255, 255, 0.4);
            text-shadow: 0 1px 2px rgba(255, 255, 255, 0.4);
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(180deg, #FFFFFF 0%, #A0A5B5 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            color: #8C94A8;
            font-size: 0.95rem;
            margin-bottom: 40px;
            font-weight: 400;
            line-height: 1.5;
        }

        /* Modern Button */
        .btn-google {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 14px 24px;
            background: #ffffff;
            color: #0F1219;
            font-size: 1.05rem;
            font-weight: 600;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 12px rgba(255, 255, 255, 0.05);
            position: relative;
            overflow: hidden;
        }

        .btn-google::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(to right, rgba(0,0,0,0), rgba(0,0,0,0.05), rgba(0,0,0,0));
            transform: translateX(-100%);
            transition: transform 0.6s ease;
        }

        .btn-google:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 255, 255, 0.15);
            background: #FAFAFA;
        }

        .btn-google:hover::before {
            transform: translateX(100%);
        }

        .btn-google:active {
            transform: translateY(1px);
        }

        .google-icon {
            width: 22px;
            height: 22px;
        }

        .alert-error {
            background: rgba(255, 69, 58, 0.1);
            border: 1px solid rgba(255, 69, 58, 0.2);
            color: #FF453A;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.9rem;
            margin-bottom: 24px;
            display: none;
            backdrop-filter: blur(10px);
        }

        /* Loading Animation */
        .loader-wrapper {
            display: none;
            margin-top: 20px;
        }

        .loader {
            display: inline-block;
            width: 32px;
            height: 32px;
            border: 3px solid rgba(255, 184, 0, 0.2);
            border-radius: 50%;
            border-top-color: #FFB800;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .footer-text {
            margin-top: 32px;
            font-size: 0.8rem;
            color: #5C637A;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="ambient-light light-1"></div>
    <div class="ambient-light light-2"></div>

    <div class="login-wrapper">
        <div class="login-card">
            <div class="brand-logo">₹</div>
            <h1>LendFlow Admin</h1>
            <p class="subtitle">Securely access your administrative dashboard and manage your lending portfolio.</p>
            
            <div id="errorMsg" class="alert-error"></div>
            
            <button id="googleSignInBtn" class="btn-google">
                <svg class="google-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                </svg>
                Sign in with Google
            </button>

            <div id="loading" class="loader-wrapper">
                <div class="loader"></div>
            </div>

            <div class="footer-text">Protected by Firebase Platform</div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";
        import { getMessaging, getToken } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-messaging.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDalhoj1HfjPU2SojdYGG6UH6dzNXo1xb8",
          authDomain: "lendflow-96ef1.firebaseapp.com",
          projectId: "lendflow-96ef1",
          storageBucket: "lendflow-96ef1.firebasestorage.app",
          messagingSenderId: "895801790086",
          appId: "1:895801790086:web:d1cb4ff1cc4e3c17d9cb07",
          measurementId: "G-9X0D114KHH"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        document.getElementById('googleSignInBtn').addEventListener('click', async () => {
            const btn = document.getElementById('googleSignInBtn');
            const loader = document.querySelector('.loader-wrapper');
            const errorMsg = document.getElementById('errorMsg');
            
            errorMsg.style.display = 'none';
            btn.style.display = 'none';
            loader.style.display = 'block';

            try {
                // 1. Google Sign In
                const result = await signInWithPopup(auth, provider);
                const idToken = await result.user.getIdToken();

                // 2. Try to get FCM Push Token (if supported and allowed)
                let fcmToken = "";
                try {
                    const messaging = getMessaging(app);
                    const permission = await Notification.requestPermission();
                    if (permission === 'granted') {
                        fcmToken = await getToken(messaging); 
                    }
                } catch (err) {
                    console.log("FCM Token fallback:", err);
                }

                // 3. Send tokens to Spring Boot Backend
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({
                        'idToken': idToken,
                        'fcmToken': fcmToken
                    })
                });

                if (response.ok) {
                    window.location.href = '/dashboard';
                } else {
                    throw new Error("Initialization failed. Please try again.");
                }

            } catch (error) {
                console.error("Login Error:", error);
                errorMsg.textContent = error.message.replace("Firebase: Error ", "");
                errorMsg.style.display = 'block';
                btn.style.display = 'flex';
                loader.style.display = 'none';
                auth.signOut();
            }
        });
    </script>
</body>
</html>
