<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - LendFlow</title>
    <!-- Inject Local Storage Theme Natively preventing unstyled flash -->
    <script>
        const storedTheme = localStorage.getItem('theme');
        if (storedTheme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
    </script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <div th:replace="~{fragments/layout :: sidebar('settings')}"></div>

    <div class="content">
        <div class="d-flex justify-content-between align-items-center mb-1">
            <h1 class="page-title mb-0">Settings</h1>
        </div>
        <p class="page-subtitle">Manage your overall dashboard configurations</p>

        <div class="table-card mt-4" style="max-width: 700px;">
            <h5 class="fw-bold mb-4" style="color: var(--text-main);">Appearance</h5>
            
            <div class="d-flex justify-content-between align-items-center pt-2">
                <div>
                    <div style="font-weight: 600; font-size: 1.05rem; color: var(--text-main);">OLED Dark Mode</div>
                    <div style="font-size: 0.85rem; color: var(--text-muted); margin-top:2px;">Turn off the lights. Activates a pure black high-contrast appearance.</div>
                </div>
                <!-- Native Bootstrap 5 Toggle Switch -->
                <div class="form-check form-switch fs-4">
                    <input class="form-check-input" type="checkbox" role="switch" id="themeToggle" style="cursor: pointer;">
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/layout :: scripts}"></div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const themeToggle = document.getElementById("themeToggle");
            const currentTheme = localStorage.getItem("theme");
            
            if (currentTheme === "dark") {
                themeToggle.checked = true;
            }
            
            themeToggle.addEventListener("change", (e) => {
                if (e.target.checked) {
                    document.documentElement.setAttribute("data-theme", "dark");
                    localStorage.setItem("theme", "dark");
                } else {
                    document.documentElement.removeAttribute("data-theme");
                    localStorage.setItem("theme", "light");
                }
            });
        });
    </script>
</body>
</html>
